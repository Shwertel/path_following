# Localizing against the map built by slam_toolbox (see config/slam_mapping.yaml).
#
# AMCL does NOT replace the EKF. The EKF keeps publishing odom -> base_link,
# smooth and continuous, which is what the controllers need. AMCL publishes
# map -> odom: the correction, which is allowed to jump. That is the REP-105
# split, and it is what stops the estimate wandering metres over a sweep with
# nothing to pull it back.
#
# A copy of nav2_bringup's stock AMCL parameters, changes marked CHANGED, plus
# the map server that feeds it.

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""               # set on the command line
    topic_name: "map"
    frame_id: "map"

amcl:
  ros__parameters:
    use_sim_time: True
    # MOTION MODEL NOISE. These say how much to distrust odometry, so raising
    # them spreads the particle cloud and makes amcl lean harder on the scan.
    # With a 360 degree scanner that was a good trade. With an 87 degree cone
    # it is backwards: the scan is now the weak input and the EKF's odometry,
    # anchored by the IMU, is the strong one. Lowered throughout.
    alpha1: 0.15                    # rotation noise from translation
    alpha2: 0.10                    # rotation noise from rotation
    alpha3: 0.20                    # translation noise from translation
                                    # Odometry here is dead-reckoned along the lane
                                    # and drifts about a centimetre per metre, so the
                                    # filter should trust the scan more than the
                                    # default assumes.
    # The decisive one. Translation noise from ROTATION, and the largest alpha
    # by far. A headland turn is 90 to 112 degrees, so at 0.4 the cloud was
    # sprayed sideways exactly while the camera swept open space with no rows
    # in view to pull it back. Every lane failure seen so far happened straight
    # after a headland turn. The sideways scrub it covered is handled by the EKF.
    alpha4: 0.15                    # was 0.4
                                    # one that matters most here. A skid-steer scrubs
                                    # sideways as it pivots - that slide is the whole
                                    # reason this project measures position against
                                    # the rows. Measured: AMCL's error spiked to 127 cm
                                    # during a headland turn and took 28 s to recover,
                                    # which is a filter too confident about where a
                                    # pivot leaves it.
    alpha5: 0.2
    base_frame_id: "base_link"      # CHANGED: no base_footprint on this rover
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # RETUNED for the depth camera. The synthesised scan carries 175 beams
    # across 87 degrees instead of 360 across the full circle, so amcl now
    # has a forward cone and nothing else to match against the map.
    laser_max_range: 5.5            # the camera is usable to about 5 m
    laser_min_range: 0.35           # the camera cannot focus closer
    laser_model_type: "likelihood_field"
    # Use more of what is left. 120 of 175 beams, against 90 of 360 before.
    # Each beam matters more when there are fewer of them.
    max_beams: 120                  # CHANGED: 360 beams available, and inside
                                    # a lane most land on the same two rows
    # More hypotheses, because each scan carries less information than before.
    max_particles: 3000
    min_particles: 800
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # 0.1 rad is 5.7 degrees, so a 112 degree headland turn ran about twenty
    # filter updates back to back, each a poor scan match against an empty
    # headland and each a chance to walk the estimate off. At 0.30 that is
    # about six, and odometry carries the rest of the turn.
    update_min_a: 0.30              # was 0.1
    update_min_d: 0.15              # was 0.10
    # Fewer beams means each should count for more.
    z_hit: 0.6                      # was 0.5
    z_max: 0.05
    z_rand: 0.4                     # was 0.5
    z_short: 0.05
    scan_topic: scan

    # Start localized instead of waiting for a pose clicked in RViz: the rover
    # spawns at the world origin and the map was built from there, so the map
    # frame and Gazebo's world frame coincide.
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
