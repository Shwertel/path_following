# Nav2 for the parts of the sweep that are NOT inside a lane: the headland
# turns between lanes, and the approach to the charging bay.
#
# Why only those parts. Inside a lane the rover steers by the crop rows either
# side of it and holds the centre to about 3 cm - better than any planner
# working off a map and a pose estimate could manage in a 1.6 m lane. In the
# headlands there are no rows to steer by, our own controller falls back to a
# straight line between two points, and it pivots in place before every move:
# measured over a full sweep, 29.5% of the time stationary and turning, 85% of
# that in the headlands, with 30 reversals of turn direction. That is what this
# replaces.
#
# The controller's output goes to /cmd_vel_raw, so it passes through
# nav2_collision_monitor like everything else.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered   # CHANGED: what robot_localization publishes
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # CHANGED. The default is "odom", which nothing on this robot publishes -
    # robot_localization publishes /odometry/filtered. A controller that never
    # sees a measured speed believes the robot is stationary on every cycle and
    # clamps each command to a single acceleration step from zero: measured,
    # pure pursuit commanded exactly 0.20 rad/s (= max_angular_accel 4.0 x the
    # 0.05 s control period) and never ramped past it, for 230 consecutive
    # messages. It looks like a speed limit and is a missing subscription.
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    # Two controllers, picked per leg by the behaviour tree's ControllerSelector:
    # FollowPath (pure pursuit) for the headlands, FollowLane for the lanes.
    controller_plugins: ["FollowPath", "FollowLane"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      # False, deliberately. With stateful True the checker latches "position
      # reached" the first time the robot is inside xy_goal_tolerance and from
      # then on checks ONLY yaw - and yaw_goal_tolerance below is 3.14, which
      # accepts any heading at all. The two together turn the goal checker into
      # a constant true. Either setting alone is harmless; together they are a
      # trap, so the latch stays off.
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      # CHANGED from 0.25 to effectively "don't care". Pure pursuit follows a
      # path and stops when the path runs out; unlike DWB it does not rotate to
      # a final goal heading. Demand one and the goal checker never passes: the
      # rover sat 16 cm from its goal - inside the position tolerance - hunting
      # back and forth on heading until the progress checker fired and the
      # recovery behaviours pushed it back out to 28 cm. On a transit leg the
      # heading on arrival is irrelevant; the next leg turns it anyway.
      yaw_goal_tolerance: 3.14
    # DWB parameters
    # Steers by the crop rows measured either side of the rover instead of by
    # the planned path. The plan still decides how far down the lane to go and
    # where to stop; the plants decide where across it the rover sits. Values
    # mirror config/greenhouse_params.yaml so it behaves like the Python
    # controller it replaces.
    FollowLane:
      plugin: "egrobots_lane_controller::LaneController"
      desired_linear_vel: 0.6
      max_angular_vel: 1.2
      # Both retuned for turn_in_place_only, where they mean something they did
      # not mean under arc steering.
      #
      # min_pivot_speed is the floor under a pivot, there to clear the ~0.1
      # rad/s at which this skid-steer breaks away from rest. At 0.6 a single
      # 10 Hz cycle turns 3.4 degrees, which is coarser than the corrections
      # lane-following needs, so the rover could only ever over- or under-shoot
      # a small re-aim. At 0.25 a cycle is 1.4 degrees. It cannot go much below
      # this: the collision monitor's slowdown multiplies it by 0.6, and
      # 0.25 x 0.6 = 0.15 is still clear of breakaway, where 0.15 x 0.6 = 0.09
      # would freeze the rover outright, as it once did for 34 s.
      min_pivot_speed: 0.25
      # 2 degrees, down from 4. Under arc steering cross-track error was
      # corrected continuously while driving. It cannot be now - straight means
      # angular.z = 0 - so the only correction is to stop and re-aim, and the
      # rover must do that far more often. At 4 degrees it did not: a 3 cm
      # offset asks for 2.6 degrees of correction via cross_track_kp, never
      # reached the threshold, and the rover drove straight on while drifting
      # until it was in the plants.
      align_tolerance_deg: 2.0
      heading_kp: 2.5
      cross_track_kp: 1.5
      max_correction_deg: 50.0
      # 0.10, up from 0.03. Every cross-track correction now costs a full stop
      # and pivot, and each pivot feeds rotational noise into amcl while giving
      # it a sweeping, feature-poor view. At 0.03 the rover pivoted on 48% of
      # all control cycles and amcl drifted 0.84 m, far enough that the planner
      # declared a perfectly centred rover blocked. Ignoring offsets under
      # 10 cm trades a little lane accuracy for far fewer pivots.
      cross_track_deadband: 0.10
      lane_offset: 0.0
      lane_timeout: 1.0
      lookahead_dist: 0.6
      lane_topic: "/lane_centreline"

    FollowPath:
      # CHANGED from DWB. Pure pursuit chases a lookahead point along the path,
      # turning and driving at the same time, which is the whole reason for
      # handing the headlands to Nav2: our own controller pivots in place first
      # and then drives, and spent 29.5% of a sweep stationary and turning.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2

      # A skid-steer cannot follow a tight arc, so turn on the spot when the
      # path doubles back - which is exactly what a headland turn does.
      use_rotate_to_heading: true
      # 0.10 rad, about 6 degrees, down from 0.6. Above this angle pure pursuit
      # stops and rotates on the spot instead of arcing, so a small threshold
      # pushes it as close to the real rover's turn-then-drive behaviour as this
      # controller can get.
      #
      # It cannot get all the way. Below the threshold pure pursuit still issues
      # curvature, i.e. linear and angular together, which is exactly the motion
      # this platform cannot perform. Only the legs driven by FollowLane are
      # strictly point-turn. See the sweep's measured blend fraction.
      rotate_to_heading_min_angle: 0.10
      rotate_to_heading_angular_vel: 1.2   # matches the navigator's angular_speed
      max_angular_accel: 4.0
      allow_reversing: false

      # Nothing may command a speed this robot cannot execute: it does not
      # rotate below about 0.1 rad/s and crawling is worse than useless.
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Off: with plants half a metre either side this would throttle the rover
      # permanently rather than occasionally.
      use_cost_regulated_linear_velocity_scaling: false

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # CHANGED from a 0.22 m circle: this rover is 0.60 x 0.64 m, and a
      # circle that covers it would be 0.44 m and would not fit a lane.
      footprint: "[[0.30, 0.32], [0.30, -0.32], [-0.30, -0.32], [-0.30, 0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]   # CHANGED
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # CHANGED from 0.55. A 1.6 m lane leaves 0.48 m of air either side of
        # this rover; inflate by more than that and the lane becomes solid
        # and the planner refuses to enter it. This is the single most common
        # reason stock Nav2 does not work on a row-crop robot.
        inflation_radius: 0.40
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # CHANGED: a 2D scan, not a cloud
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # The synthesised scan reports inf for a bearing where nothing stood
          # in the height band. A finite reading there would mark a phantom
          # obstacle at whatever range the floor happened to be. inf marks
          # nothing, and with this set it still clears the ray, which is how
          # the robot is able to drive into space it has only seen floor in.
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # False, not True. With True the whole grid is republished every cycle -
      # for the global costmap that is 698 x 318 = 222k cells every second -
      # and rviz rebuilds the entire texture each time. That is what left the
      # window not responding, and it kept happening after the depth image
      # display was already switched off. False publishes incremental updates
      # instead, which is what rviz is built to consume. Nav2 itself does not
      # care either way; only the visualiser reads these.
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # CHANGED from a 0.22 m circle: this rover is 0.60 x 0.64 m, and a
      # circle that covers it would be 0.44 m and would not fit a lane.
      footprint: "[[0.30, 0.32], [0.30, -0.32], [-0.30, -0.32], [-0.30, 0.32]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # The synthesised scan reports inf for a bearing where nothing stood
          # in the height band. A finite reading there would mark a phantom
          # obstacle at whatever range the floor happened to be. inf marks
          # nothing, and with this set it still clears the ray, which is how
          # the robot is able to drive into space it has only seen floor in.
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # CHANGED from 0.55. A 1.6 m lane leaves 0.48 m of air either side of
        # this rover; inflate by more than that and the lane becomes solid
        # and the planner refuses to enter it. This is the single most common
        # reason stock Nav2 does not work on a row-crop robot.
        # 0.25, deliberately BELOW the footprint's inscribed radius of 0.30.
        # The band the planner REFUSES is min(inflation_radius, inscribed) -
        # every cell inside the inscribed radius is marked INSCRIBED and
        # GridBased will neither start in one nor route through one. At 0.40
        # the refused band was the full 0.30 from each row face, leaving about
        # 0.8 m of a 1.6 m lane once the rows' wander is counted, so a lateral
        # pose error over roughly 0.4 m made the lane unplannable. Amcl on this
        # camera has been measured 0.73 m out after a headland turn, which is
        # exactly where lane 2 kept being declared blocked and the planner
        # rerouted around the outside instead.
        #
        # This loosens PLANNING only. The local costmap keeps its 0.40 and the
        # collision monitor still stops on raw scan, so the rover does not
        # drive any closer to the plants because of this.
        inflation_radius: 0.25
      # False, not True. With True the whole grid is republished every cycle -
      # for the global costmap that is 698 x 318 = 222k cells every second -
      # and rviz rebuilds the entire texture each time. That is what left the
      # window not responding, and it kept happening after the depth image
      # display was already switched off. False publishes incremental updates
      # instead, which is what rviz is built to consume. Nav2 itself does not
      # care either way; only the visualiser reads these.
      always_send_full_costmap: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
