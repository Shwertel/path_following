line_navigator_node:
  ros__parameters:
    # --- R3/R4: walk then pause, repeat ---
    walk_duration: 5.0
    pause_duration: 5.0

    # --- R2/R7: line following ---
    linear_speed: 0.6
    angular_speed: 0.8
    cross_track_kp: 1.2          # steer-back gain per metre off the line
    max_correction_deg: 60.0     # cap on how hard it cuts back
    return_angular_speed: 0.8    # same as normal turning (slow pivots not achievable on the heavy robot)
    return_max_correction_deg: 60.0  # same as normal cut-back
    align_tolerance_deg: 4.0     # pivot until within this, then drive straight
    min_pivot_speed: 0.3         # rad/s; below ~0.1 the rover cannot break scrub and never turns
    cross_track_deadband: 0.05   # ignore smaller offsets; avoids pivoting on noise
    heading_kp: 1.5
    on_line_threshold: 0.20      # within this, treat as on the line
    goal_tolerance: 0.25
    goal_approach_distance: 1.0

    # --- R5/R6: obstacle avoidance ---
    safe_distance: 1.2
    clear_distance: 1.5
    cone_angle_deg: 30.0
    direction_scan_deg: 90.0
    clearing_distance: 1.5

    stall_timeout: 20.0
    stall_min_progress: 0.15
    side_clearance: 0.5          # extra room abeam before swerving to that side
    side_window_deg: 20.0

    use_road_centreline: true    # path is set by the car rows, when detected
    # Where the lane sits relative to the centre between the rows: + is left,
    # - is right, 0.0 drives down the middle. -1.5 m on a 6 m lane keeps the
    # rover in the right-hand half, about 1.5 m off the right-hand row.
    lane_offset: -1.5

    reference_frame: "odom"
    robot_frame: "base_link"
